# ${HOME} will be replaced by user home directory according to platform
default_userdir="${HOME}/.${APPNAME}/v1.2.2"
default_mac_userdir="${HOME}/Library/Application Support/${APPNAME}/v1.2.2"

# options used by the launcher by default, can be overridden by explicit
# command line switches
default_options="--branding dwr_eppt -J-Xms256m -J-Xmx4g -J-Dsun.java2d.d3d=false -J-Dsun.java2d.noddraw=true -J--add-opens=java.base/java.lang=ALL-UNNAMED  -J--add-opens=java.base/java.net=ALL-UNNAMED -J--add-opens=java.desktop/sun.awt=ALL-UNNAMED -J--add-opens=java.desktop/javax.swing=ALL-UNNAMED"
# for development purposes you may wish to append: -J-Dnetbeans.logger.console=true -J-ea

# default location of JDK/JRE, can be overridden by using --jdkhome <dir> switch
#jdkhome="/path/to/jdk"
jdkhome="jre"

# clusters' paths separated by path.separator (semicolon on Windows, colon on Unices)
#extra_clusters=
